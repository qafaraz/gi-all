name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (gerçek release yapma, sadece simüle et)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Fix #9: Least privilege global default
permissions: {}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Fix #9: Scoped job permission for git tags & releases

    steps:
      - name: Checkout repository
        # Fix #8: SHA pinned action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        # Fix #8: SHA pinned action
        uses: actions/setup-node@39370e3970a6d050c08020d2b52479e0a0d42646 # v4.1.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Release (dry run)
        if: ${{ inputs.dry_run == 'true' }}
        run: npm run release:dry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        if: ${{ inputs.dry_run == 'false' || github.event_name == 'push' }}
        run: npm run release -- --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
